<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#1e5799;stop-opacity:1"/>
      <stop offset="50%" style="stop-color:#87ceeb;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#4a9b7a;stop-opacity:1"/>
    </linearGradient>
    <linearGradient id="lake" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#2980b9;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#1a5276;stop-opacity:1"/>
    </linearGradient>
  </defs>
  <rect width="800" height="500" fill="url(#bg)"/>
  <!-- Mountains -->
  <polygon points="0,300 150,150 300,300" fill="#5d6d7e"/>
  <polygon points="100,300 250,120 400,300" fill="#7f8c8d"/>
  <polygon points="300,300 450,140 600,300" fill="#6c7a7d"/>
  <polygon points="500,300 650,160 800,300" fill="#5d6d7e"/>
  <!-- Lake -->
  <ellipse cx="400" cy="380" rx="380" ry="80" fill="url(#lake)" opacity="0.9"/>
  <rect y="380" width="800" height="120" fill="#1a5276"/>
  <!-- City lights reflection -->
  <rect x="50" y="370" width="700" height="10" fill="#3498db" opacity="0.3" rx="5"/>
  <!-- Trees on hills -->
  <polygon points="80,300 95,265 110,300" fill="#1a5c3a"/>
  <polygon points="110,300 125,268 140,300" fill="#217a4e"/>
  <polygon points="650,300 665,270 680,300" fill="#1a5c3a"/>
  <polygon points="680,300 695,272 710,300" fill="#217a4e"/>
</svg>
