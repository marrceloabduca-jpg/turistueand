<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500">
  <defs>
    <linearGradient id="sky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#0c2d5e;stop-opacity:1"/>
      <stop offset="50%" style="stop-color:#1e6799;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#8ec5e0;stop-opacity:1"/>
    </linearGradient>
    <linearGradient id="mountain" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:1"/>
      <stop offset="30%" style="stop-color:#a8c8d8;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#7a8a9e;stop-opacity:1"/>
    </linearGradient>
  </defs>
  <rect width="800" height="500" fill="url(#sky)"/>
  <!-- Andes mountains with snow -->
  <polygon points="0,400 100,200 200,350 300,150 400,320 500,100 600,280 700,170 800,320 800,500 0,500" fill="url(#mountain)"/>
  <!-- Snow caps -->
  <polygon points="280,200 300,150 320,195" fill="white"/>
  <polygon points="480,150 500,100 520,145" fill="white"/>
  <polygon points="680,215 700,170 720,210" fill="white"/>
  <!-- Vineyard rows -->
  <rect y="400" width="800" height="100" fill="#5a8c3a"/>
  <line x1="0" y1="415" x2="800" y2="415" stroke="#3d6b27" stroke-width="2"/>
  <line x1="0" y1="430" x2="800" y2="430" stroke="#3d6b27" stroke-width="2"/>
  <line x1="0" y1="445" x2="800" y2="445" stroke="#3d6b27" stroke-width="2"/>
  <line x1="0" y1="460" x2="800" y2="460" stroke="#3d6b27" stroke-width="2"/>
  <!-- Vineyard posts -->
  <line x1="80" y1="400" x2="80" y2="470" stroke="#5c3a1e" stroke-width="3"/>
  <line x1="200" y1="400" x2="200" y2="470" stroke="#5c3a1e" stroke-width="3"/>
  <line x1="320" y1="400" x2="320" y2="470" stroke="#5c3a1e" stroke-width="3"/>
  <line x1="440" y1="400" x2="440" y2="470" stroke="#5c3a1e" stroke-width="3"/>
  <line x1="560" y1="400" x2="560" y2="470" stroke="#5c3a1e" stroke-width="3"/>
  <line x1="680" y1="400" x2="680" y2="470" stroke="#5c3a1e" stroke-width="3"/>
</svg>
