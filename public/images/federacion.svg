<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500">
  <defs>
    <linearGradient id="sky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#1a6b9e;stop-opacity:1" />
      <stop offset="60%" style="stop-color:#4ea5d9;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#7ecbe6;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="water" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#1a8fa3;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0d6b8a;stop-opacity:1" />
    </linearGradient>
  </defs>
  <rect width="800" height="500" fill="url(#sky)"/>
  <ellipse cx="400" cy="200" rx="350" ry="120" fill="#2d9a8a" opacity="0.4"/>
  <rect y="300" width="800" height="200" fill="url(#water)"/>
  <rect y="270" width="800" height="60" fill="#22a385" rx="0"/>
  <!-- Hot springs bubbles -->
  <circle cx="200" cy="310" r="15" fill="#7ecbe6" opacity="0.5"/>
  <circle cx="300" cy="320" r="10" fill="#7ecbe6" opacity="0.4"/>
  <circle cx="500" cy="305" r="18" fill="#7ecbe6" opacity="0.5"/>
  <circle cx="600" cy="315" r="12" fill="#7ecbe6" opacity="0.4"/>
  <!-- Trees -->
  <polygon points="100,270 115,230 130,270" fill="#1a5c3a"/>
  <polygon points="650,265 667,220 684,265" fill="#1a5c3a"/>
  <polygon points="720,270 735,235 750,270" fill="#1a5c3a"/>
</svg>
